en:{ h:"Who is the bravest in your group?", sub:"Send the quiz to your friends and compare your player types.", send:"Send invite", copy:"Copy invite", copied:"Copied", text:"I dare you! What kind of player are you in horror games? Take the quiz:" },

function doCopy(url, ok, fail) {
  function fb() { if (legacyCopy(url)) ok(); else fail(); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, fb);
    else fb();
  } catch (e) { fb(); }
}
function openInvite() {
  var IV = INV[lang], url = appUrl(), canShare = isMobile() && !!navigator.share, full = IV.text + "\n" + url;
  openInfo(MORE[lang].invite, function (body) {
    var card = el("div", "inv");
    var rec = el("span", "rec"); rec.appendChild(el("span", "dot")); rec.appendChild(document.createTextNode("REC"));
    card.appendChild(rec);
    card.appendChild(el("h4", "", IV.h));
    card.appendChild(el("p", "sub", IV.sub));
    var ty = el("div", "types"); ty.setAttribute("aria-hidden", "true");
    ORDER.forEach(function (k) { ty.appendChild(el("span", "", EMOJI[k])); });
    ty.appendChild(el("i", "ret"));
    card.appendChild(ty);
    body.appendChild(card);

    var linkBox = el("p", "invlink", full); linkBox.hidden = true;
    function copyTile(cls) {
      var t = el("button", cls); t.type = "button";
      setBtnLabel(t, "copy", IV.copy);
      t.onclick = function () {
        sfx("pick");
        doCopy(full, function () {
          t.classList.add("done"); setBtnLabel(t, "check", IV.copied); toast(MORE[lang].copied);
          setTimeout(function () { t.classList.remove("done"); setBtnLabel(t, "copy", IV.copy); }, 2000);
        }, function () { linkBox.hidden = false; });
      };
      return t;
    }
    if (canShare) {
      var send = el("button", "btn wide ic"); send.type = "button";
      setBtnLabel(send, "send", IV.send);
      send.onclick = function () {
        sfx("pick");
        try {
          navigator.share({ title: T("title"), text: IV.text, url: url }).catch(function (err) {
            if (err && err.name !== "AbortError") linkBox.hidden = false;
          });
        } catch (e) { linkBox.hidden = false; }
      };
      body.appendChild(send);
    } else {
      var main = copyTile("btn wide ic"); body.appendChild(main);
    }
    var tiles = el("div", "tiles");
    var msg = encodeURIComponent(full);
    [["line", "LINE", (isMobile() ? "https://line.me/R/msg/text/?" + msg : "https://social-plugins.line.me/lineit/share?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(IV.text))],
     ["fbk", "Facebook", "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url) + "&quote=" + encodeURIComponent(IV.text)]].forEach(function (c) {
      var a = el("a", "tile"); a.appendChild(icon(c[0])); a.appendChild(el("span", "", c[1]));
      a.href = c[2]; a.target = "_blank"; a.rel = "noopener noreferrer";
      tiles.appendChild(a);
    });
    if (canShare) tiles.appendChild(copyTile("tile"));
    body.appendChild(tiles);
    body.appendChild(linkBox);
  }, "invite");
}
